[workspace]
authors = ["Maximilian Hofmeister <118777287+DrizzelDizzel@users.noreply.github.com>"]
channels = ['conda-forge']
name = "adaptive-rl"
platforms = ['osx-arm64']
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
numpy = ">=2.4.6,<3"
matplotlib = ">=3.11.2,<4"
pyyaml = ">=6.0.3,<7"
pytest = ">=9.2.0,<10"
tensorboard = ">=2.21.0,<3"

[pypi-dependencies]
torch = ">=2.10.0, <3"
gymnasium = { version = ">=1.4.0, <2", extras = ["mujoco"] }
adaptive-rl = { path = ".", editable = true }

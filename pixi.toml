[workspace]
authors = ["Maximilian Hofmeister <118777287+DrizzelDizzel@users.noreply.github.com>"]
channels = ['conda-forge']
name = "adaptive-rl"
platforms = ['osx-arm64']
version = "0.1.0"

[tasks]
smoke = "python scripts/crazyflow_smoke.py"
smoke-render = "python scripts/crazyflow_smoke.py --render"

# Only Python comes from conda; everything else from PyPI, so no package exists twice.
[dependencies]
python = "3.11.*"

[pypi-dependencies]
# Drone simulator (JAX + MuJoCo). Brings jax, numpy, scipy, mujoco, mujoco-mjx, gymnasium, flax.
crazyflow = ">=0.4.0, <0.5"
# Guard: mujoco and mujoco-mjx must share the major version. Since 4.0 both install into the
# same folder via mujoco-core; a 3.x/4.x mix breaks `import mujoco`.
mujoco = ">=4.0.0, <5"
mujoco-mjx = ">=4.0.0, <5"
adaptive-rl = { path = ".", editable = true }
